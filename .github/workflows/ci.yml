name: CI
run-name: CI ${{ github.ref_name }}

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test release asset tag safety
        run: ./test_release_asset_tag_safety.sh

      - name: Test notification group migration
        run: ./test_notify_groups_migration.sh

      - name: Test notification group save failures
        run: ./test_notify_groups_save.sh

      - name: Test notification group editor save handling
        run: ./test_tray_notify_group_editor_modal.sh

      - name: Test notification group editor client area
        run: ./test_tray_notify_group_client_area.sh

      - name: Test notification group editor bulk toggles
        run: ./test_tray_notify_group_bulk_toggle.sh

      - name: Test notification group selection after refresh
        run: ./test_tray_notify_group_selection.sh

      - name: Test notification tab command routing
        run: ./test_tray_notify_command_routing.sh

      - name: Test tray dialog reentrancy
        run: bash test_tray_dialog_reentrancy.sh

      - name: Test General tab keyboard navigation
        run: ./test_tray_general_tab_keyboard_navigation.sh

      - name: Test settings dialog work-area fitting
        run: ./test_tray_settings_dialog_work_area.sh

      - name: Test custom duration dialog work-area fitting
        run: ./test_tray_custom_dialog_work_area.sh

      - name: Test About dialog monitor positioning
        run: ./test_tray_about_dialog_monitor.sh

      - name: Test keyboard tray menu anchoring
        run: ./test_tray_keyboard_menu_anchor.sh

      - name: Test custom duration dialog monitor selection
        run: ./test_tray_custom_dialog_monitor.sh

      - name: Test custom duration registry persistence
        run: ./test_tray_custom_duration_settings.sh

      - name: Test CLI settings failures and PATH addition
        run: bash test_cli_settings_failures.sh

      - name: Test Unicode PATH registry updates
        run: bash test_path_unicode.sh

      - name: Test executable directory extraction
        run: bash test_exe_dir.sh

      - name: Test tray event cleanup on initialization failure
        run: bash test_tray_create_event_cleanup.sh

      - name: Test tray window and shell icon teardown
        run: bash test_tray_destroy_shell_icon_cleanup.sh

      - name: Test tray menu initialization failure cleanup
        run: bash test_tray_menu_init_failure.sh

      - name: Test tray icon restoration after Explorer restart
        run: bash test_tray_taskbar_restore.sh

      - name: Test countdown icon lifetime
        run: bash test_tray_countdown_icon.sh

      - name: Test automatic update timer failures
        run: bash test_tray_auto_update_timer.sh

      - name: Test asynchronous update checks
        run: bash test_tray_async_update_check.sh

      - name: Test numbered icon ownership
        run: bash test_tray_numbered_icon.sh

      - name: Test lazy icon compile toolchain detection
        run: ./test_lazy_icon_loading_toolchain_detection.sh

      - name: Test updater unit tests
        run: |
          make test-unit
          ./test_test_unit_failure_propagation.sh

      - name: Test updater download dialog positioning
        run: ./test_updater_download_position.sh

      - name: Test rebuild on version changes
        run: ./test_make_version_rebuild.sh

      - name: Test core duration boundary
        run: ./test_core_duration_boundary.sh

      - name: Test verbose debug logging
        run: ./test_core_verbose_logging.sh

      - name: Test portable core logging and elapsed time
        run: bash ./test_core_log_time.sh

      - name: Test CLI UTF-8 argument conversion failures
        run: ./test_cli_utf8_arguments.sh

      - name: Test actionable CLI parse errors
        run: bash test_cli_parse_errors.sh

      - name: Test tray cancellation notice action
        run: bash test_tray_cancellation_notice_action.sh

      - name: Test countdown tooltip rounding
        run: bash test_tray_countdown_action.sh

      - name: Test stop menu labels for pending delayed actions
        run: bash test_tray_stop_menu_pending_action.sh

      - name: Test delayed action handle cleanup
        run: ./test_tray_delayed_action_completion.sh

      - name: Test concurrent countdown cleanup ownership
        run: bash test_tray_countdown_cleanup.sh

      - name: Test tray stop timeout worker retention
        run: ./test_tray_concurrent_stop.sh

      - name: Install MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Test prerelease resource versions
        run: RC=x86_64-w64-mingw32-windres ./test_resource_prerelease_version.sh

      - name: Cross-compile native Windows logging thread test
        run: >-
          x86_64-w64-mingw32-gcc -std=c99 -Wall -Wextra -O0 -g -Isrc
          tests/test_core_log_time_windows.c src/core.c
          -o "$RUNNER_TEMP/test_core_log_time_windows.exe" -lkernel32 -luser32

      - name: Build
        run: make CC=x86_64-w64-mingw32-gcc RC=x86_64-w64-mingw32-windres

      - name: Verify binary exists
        run: |
          if [ -f bin/nosleep.exe ]; then
            echo "Binary successfully built: bin/nosleep.exe"
            file bin/nosleep.exe
          else
            echo "ERROR: Binary not found"
            exit 1
          fi
